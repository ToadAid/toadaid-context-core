name: pr-verify

# Runs ONLY on pull_request events.
#
# Trust boundary: this workflow executes untrusted PR source code.
# It MUST run exclusively on GitHub-hosted ephemeral infrastructure.
# It MUST NOT use self-hosted runners, expose secrets, or call
# privileged infrastructure.
#
# The self-hosted HP runner (see ci.yml) is reserved for trusted
# push-to-main and explicit workflow_dispatch verification only.

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-verify:
    name: PR verification (GitHub-hosted)
    # While this repository is private, trusted verification is performed
    # explicitly through ci.yml workflow_dispatch on the self-hosted HP runner.
    # Once the repository is public, untrusted PR verification activates here
    # automatically and remains GitHub-hosted only.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        # Node 22 is current LTS (active LTS since Oct 2024); satisfies engines.node >=20.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Run tests
        shell: bash
        run: |
          set -uo pipefail
          node --version
          node --test test/*.test.mjs

      - name: Run demo
        shell: bash
        run: |
          set -uo pipefail
          node bin/demo.mjs > /tmp/context-core-demo.json
          node -e "
            const fs = require('fs');
            JSON.parse(fs.readFileSync('/tmp/context-core-demo.json', 'utf8'));
            console.log('demo_json: VALID');
          "
