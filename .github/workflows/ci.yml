name: main-verify

# Trusted mainline verification.
#
# Public release policy:
# - GitHub-hosted ephemeral infrastructure only.
# - No self-hosted runner dependency.
# - No pull_request_target.
# - Read-only repository permission.
# - Checkout credentials are not persisted.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Main verification (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Run tests
        shell: bash
        run: |
          set -uo pipefail
          node --version
          node --test test/*.test.mjs

      - name: Run demo
        shell: bash
        run: |
          set -uo pipefail
          node bin/demo.mjs > /tmp/context-core-demo.json
          node -e "
            const fs = require('fs');
            JSON.parse(fs.readFileSync('/tmp/context-core-demo.json', 'utf8'));
            console.log('demo_json: VALID');
          "
